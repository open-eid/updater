name: Checks
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  checks:
    uses: open-eid/.github/.github/workflows/checks.yml@fcc10a5288079edae6cf554759e675a8bf66d5d6 # master
    with:
      # Apple .strings catalogues and Qt .ts translations are regenerated by
      # Xcode / lupdate tooling, which strips any header
      exclude: (\.lproj/|\.ts$)
